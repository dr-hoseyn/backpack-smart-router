name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Go tests
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...
          go test -run '^$' -bench . -benchmem ./internal/router
          BACKPACK_TEST_CONNECTIONS=5000 go test -count=1 -run TestConcurrentForwarding -v ./internal/router
      - name: Kernel controller tests
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Build panel and packages
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          for script in install.sh install-online.sh deploy/*.sh; do bash -n "$script"; done
          version=v0.0.0-ci
          if [[ $GITHUB_REF_TYPE == tag ]]; then version=$GITHUB_REF_NAME; fi
          bash deploy/package.sh "$version" amd64
          bash deploy/package.sh "$version" arm64
          (cd bin && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Install the kernel router and restart the dashboard on Ubuntu
        shell: bash
        run: |
          smoke=$(mktemp -d)
          tar -xzf bin/*-amd64.tar.gz -C "$smoke"
          cd "$smoke"/backpack-smart-router-*
          previous_forwarding=$(sysctl -n net.ipv4.ip_forward)
          cleanup() {
            sudo bash deploy/uninstall.sh || true
            sudo nft delete table ip backpack_router_kernel || true
            sudo sysctl -w "net.ipv4.ip_forward=$previous_forwarding" >/dev/null
            sudo ip link del bp-install-wan || true
            sudo ip link del bp-install-lan || true
            rm -rf -- "$smoke"
          }
          trap cleanup EXIT
          sudo ip link add bp-install-wan type dummy
          sudo ip link add bp-install-lan type dummy
          sudo ip addr add 203.0.113.10/32 dev bp-install-wan
          sudo ip addr add 10.0.0.2/24 dev bp-install-lan
          sudo ip link set bp-install-wan up
          sudo ip link set bp-install-lan up
          if ! sudo bash install.sh --kernel --public-interface bp-install-wan --public-ip 203.0.113.10 \
              --private-interface bp-install-lan --private-ip 10.0.0.2 --port 8443 --backend 10.0.0.11 \
              --syn-rate 480 --syn-rate-per-ip 12 >"$smoke/install.log"; then
            sudo journalctl -u backpack-router-engine -u backpack-router-panel -u backpack-router-kernel-forward --lines 50 --no-pager
            exit 1
          fi
          grep -Fxq 'Default web panel: http://127.0.0.1:9080/' "$smoke/install.log"
          grep -Fxq 'Initial login: admin' "$smoke/install.log"
          grep -Eq '^Initial password: [[:xdigit:]]{40}$' "$smoke/install.log"
          systemctl is-active --quiet backpack-router-kernel-forward.service
          systemctl is-active --quiet backpack-router-kernel-metrics.service
          systemctl is-active --quiet backpack-router-native-tcp-ingress.service
          systemctl is-active --quiet backpack-router-tcp-admission.service
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:9080/
          sudo curl --fail --unix-socket /run/backpack-router/control.sock http://router/status
          pid=$(systemctl show backpack-router-engine -p MainPID --value)
          sudo systemctl restart backpack-router-panel
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:9080/
          test "$pid" = "$(systemctl show backpack-router-engine -p MainPID --value)"
      - name: Verify the public TCP relay forwards to the same port on a different address
        run: |
          smoke=$(mktemp -d)
          archive=(bin/*-amd64.tar.gz)
          tar -xzf "${archive[0]}" -C "$smoke"
          package=("$smoke"/backpack-smart-router-*)
          units=/etc/systemd/system
          relay=backpack-router-tcp-relay
          cleanup() {
            sudo systemctl stop "$relay.socket" "$relay.service" || true
            sudo rm -f "$units/$relay.socket" "$units/$relay.service"
            sudo systemctl daemon-reload
            kill "$backend"
            rm -rf -- "$smoke"
          }
          printf 'BackPack TCP relay\n' > "$smoke/check.txt"
          python3 -m http.server 8443 --bind 127.0.0.1 --directory "$smoke" &
          backend=$!
          trap cleanup EXIT
          sed 's/203\.0\.113\.10/127.0.0.2/' "${package[0]}/deploy/$relay.socket.example" | sudo tee "$units/$relay.socket" >/dev/null
          sed 's/10\.0\.0\.11/127.0.0.1/' "${package[0]}/deploy/$relay.service.example" | sudo tee "$units/$relay.service" >/dev/null
          curl --fail --retry 5 --retry-connrefused --retry-delay 1 http://127.0.0.1:8443/check.txt
          sudo systemctl daemon-reload
          sudo systemctl start "$relay.socket"
          curl --fail --noproxy '*' http://127.0.0.2:8443/check.txt | cmp - "$smoke/check.txt"
          relay_pid=$(systemctl show "$relay.service" --property=MainPID --value)
          grep -Eq '^Max open files +32768 +32768' "/proc/$relay_pid/limits"
      - name: Verify the dashboard counters for public TCP ingress
        run: |
          smoke=$(mktemp -d)
          archive=(bin/*-amd64.tar.gz)
          tar -xzf "${archive[0]}" -C "$smoke"
          package=("$smoke"/backpack-smart-router-*)
          backend=
          engine=
          cleanup() {
            sudo nft delete table ip backpack_router_native_tcp || true
            sudo ip netns del backpack-client || true
            sudo ip link del backpack-wan || true
            sudo ip addr del 10.0.0.2/32 dev lo || true
            if [[ -n $engine ]]; then kill "$engine" || true; wait "$engine" || true; fi
            if [[ -n $backend ]]; then kill "$backend" || true; wait "$backend" || true; fi
            rm -rf -- "$smoke"
          }
          trap cleanup EXIT
          sudo ip netns add backpack-client
          sudo ip link add backpack-wan type veth peer name client-wan netns backpack-client
          sudo ip addr add 203.0.113.10/24 dev backpack-wan
          sudo ip link set backpack-wan up
          sudo ip -n backpack-client addr add 203.0.113.11/24 dev client-wan
          sudo ip -n backpack-client link set client-wan up
          sudo ip -n backpack-client route add 10.0.0.2 via 203.0.113.10
          sudo ip addr add 10.0.0.2/32 dev lo
          sed 's/"eth0"/"backpack-wan"/' "${package[0]}/deploy/native-tcp-ingress.nft.example" > "$smoke/ingress.nft"
          sudo nft -c -f "$smoke/ingress.nft"
          printf 'BackPack measured TCP ingress\n' > "$smoke/check.txt"
          python3 -m http.server 8443 --bind 127.0.0.1 --directory "$smoke" &
          backend=$!
          jq '.groups = [{id:"vless-8443",tcp:"10.0.0.2:8443",backends:[{id:"measured",name:"Measured backend",tcp:"127.0.0.1:8443",weight:1,enabled:true}]}]
              | .checkIntervalMS = 500 | .recoveries = 1' "${package[0]}/deploy/engine.example.json" > "$smoke/engine.json"
          "${package[0]}/backpack-router" engine -config "$smoke/engine.json" -socket "$smoke/control.sock" &
          engine=$!
          for ((attempt=0; attempt<15; attempt++)); do
            if curl -fsS --unix-socket "$smoke/control.sock" http://router/status 2>/dev/null |
               jq -e '.backends[] | select(.id == "measured" and .state == "healthy")' >/dev/null; then break; fi
            sleep 1
          done
          sudo nft -f "$smoke/ingress.nft"
          sudo ip netns exec backpack-client curl --fail --max-time 5 --noproxy '*' http://203.0.113.10:8443/check.txt | cmp - "$smoke/check.txt"
          curl -fsS --unix-socket "$smoke/control.sock" http://router/status |
            jq -e '.backends[] | select(.id == "measured" and .rx > 0 and .tx > 0)' >/dev/null
          if sudo ip netns exec backpack-client curl --fail --max-time 1 --noproxy '*' http://10.0.0.2:8443/check.txt; then
            exit 1
          fi
      - name: Verify primary Linux kernel forwarding on port 8443
        run: |
          smoke=$(mktemp -d)
          archive=(bin/*-amd64.tar.gz)
          tar -xzf "${archive[0]}" -C "$smoke"
          package=("$smoke"/backpack-smart-router-*)
          script="${package[0]}/deploy/kernel-forward.py"
          cleanup() {
            for namespace in bp-router bp-client bp-backend; do
              sudo ip netns pids "$namespace" | xargs -r sudo kill || true
              sudo ip netns del "$namespace" || true
            done
            rm -rf -- "$smoke"
          }
          trap cleanup EXIT
          for namespace in bp-router bp-client bp-backend; do sudo ip netns add "$namespace"; done
          sudo ip -n bp-router link add wan type veth peer name eth0 netns bp-client
          sudo ip -n bp-router link add lan type veth peer name eth0 netns bp-backend
          while read -r namespace interface address; do
            sudo ip -n "$namespace" addr add "$address" dev "$interface"
            sudo ip -n "$namespace" link set "$interface" up
          done <<'ENDPOINTS'
          bp-router wan 203.0.113.10/24
          bp-router lan 10.0.0.2/24
          bp-client eth0 203.0.113.11/24
          bp-backend eth0 10.0.0.11/24
          ENDPOINTS
          sudo ip -n bp-router link set lo up
          printf 'BackPack kernel data plane\n' > "$smoke/check.txt"
          sudo ip netns exec bp-backend python3 -m http.server 8443 --bind 10.0.0.11 --directory "$smoke" &
          sudo ip netns exec bp-router python3 "${package[0]}/deploy/kernel-setup.py" "$smoke" \
            --public-interface wan --public-ip 203.0.113.10 --private-interface lan --private-ip 10.0.0.2 \
            --port 8443 --backend 10.0.0.11
          sudo ip netns exec bp-router nft -c -f "$smoke/native-tcp-ingress.nft"
          jq '.checkIntervalMS = 500 | .recoveries = 1' "$smoke/engine.json" > "$smoke/test-engine.json"
          sudo ip netns exec bp-router "${package[0]}/backpack-router" engine -config "$smoke/test-engine.json" -socket "$smoke/control.sock" &
          jq --arg sock "$smoke/control.sock" '.health_socket=$sock' "$smoke/kernel-forward.json" > "$smoke/kernel.json"
          sudo ip netns exec bp-router "$script" "$smoke/kernel.json" init
          sudo ip netns exec bp-router sysctl -w net.ipv4.ip_forward=1
          sudo ip netns exec bp-router "$script" "$smoke/kernel.json" run --share-file "$smoke/no-share-override" &
          for ((attempt=0; attempt<15; attempt++)); do
            if sudo ip netns exec bp-router nft list chain ip backpack_router_kernel dispatch | grep -q '0-999 : jump'; then break; fi
            sleep 1
          done
          sudo ip netns exec bp-client curl -fsS --max-time 5 --noproxy '*' http://203.0.113.10:8443/check.txt | cmp - "$smoke/check.txt"
          sudo ip netns exec bp-router "$script" "$smoke/kernel.json" counters | jq -e '.["10.0.0.11"] > 0'
          sudo curl -fsS --unix-socket "$smoke/control.sock" http://router/status | jq -e '.rx == 0 and .tx == 0'
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux-packages
          path: bin/
          if-no-files-found: error

  online-install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the public package and check initial login output
        shell: bash
        run: |
          log=$(mktemp)
          trap 'rm -f -- "$log"' EXIT
          cat install-online.sh | bash >"$log"
          grep -Fxq 'Initial login: admin' "$log"
          grep -Eq '^Initial password: [[:xdigit:]]{40}$' "$log"
          grep -Fxq 'Default web panel: http://127.0.0.1:9080/' "$log"
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:9080/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: linux-packages
          path: packages
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
